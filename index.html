/* Layout: one-screen portrait arcade cabinet — status bar, pixel stadium, scrolling panel, coupon bar, 4-tab nav. Single dark look by design. */
:root{
  color-scheme:dark;
  --ink:#0f0f1b; --bg:#1a1c2c; --panel:#262b44; --panel2:#333c57; --line:#0b0b14; --hi:#566c86;
  --text:#f4f4f4; --muted:#94b0c2; --gold:#ffcd75; --orange:#ef7d57; --red:#b13e53;
  --green:#38b764; --lime:#a7f070; --teal:#257179; --blue:#3b5dc9; --sky:#41a6f6; --purple:#5d275d;
  --f-disp:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"VT323", ui-monospace, "Courier New", monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:20px;line-height:1.1;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;border-left:3px solid var(--line);border-right:3px solid var(--line)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* status bar */
.top{display:flex;align-items:stretch;gap:6px;padding-block:8px;background:var(--panel2);border-bottom:3px solid var(--line);flex:none}
.stat{display:flex;align-items:center;gap:6px;background:var(--ink);border:3px solid var(--line);padding:4px 7px;min-width:0}
.stat b{font-family:var(--f-disp);font-size:11px;font-weight:400;white-space:nowrap}
.stat small{font-size:15px;color:var(--muted);white-space:nowrap}
.stat.coin{flex:1}
.stat.coin b{color:var(--gold)}
.stat.tp b{color:var(--lime)}
.stat.en b{color:var(--sky)}

/* stadium */
.scene{position:relative;border-bottom:3px solid var(--line);background:var(--ink);flex:none;cursor:pointer}
#pitch{display:block;width:100%;height:auto;aspect-ratio:160/64;image-rendering:pixelated;image-rendering:crisp-edges}
.sb{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(15,15,27,.88);border:2px solid var(--line);padding:3px 6px;font-family:var(--f-disp);font-size:9px;white-space:nowrap;max-width:94%}
.sb .scr{color:var(--gold);font-size:11px}
.sb .min{color:var(--orange)}
.sb .lgc{padding:1px 3px;color:var(--ink);background:var(--gold)}
.ffb{position:absolute;right:6px;bottom:6px;font-family:var(--f-disp);font-size:8px;padding:5px 6px;background:rgba(15,15,27,.88);border:2px solid var(--line);color:var(--text)}
.ffb.on{background:var(--gold);color:var(--ink);animation:blink .6s steps(2) infinite}
.watch{font-family:var(--f-disp);font-size:7px;padding:3px 5px;background:var(--panel2);border:2px solid var(--line);color:var(--muted)}
.watch.on{background:var(--sky);color:var(--ink)}
.goal{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:28px;color:var(--gold);text-shadow:3px 3px 0 var(--red),-2px -2px 0 var(--line);pointer-events:none;animation:blink .25s steps(2) infinite}

/* main */
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 18px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;min-height:0}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 3px 0 rgba(255,255,255,.07),0 3px 0 var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.h{font-family:var(--f-disp);font-size:10px;color:var(--gold);margin:0;display:flex;align-items:center;gap:6px;line-height:1.4;text-wrap:balance}
.h small{margin-left:auto;font-size:8px;color:var(--muted)}
.sec{font-family:var(--f-disp);font-size:9px;color:var(--muted);margin:6px 0 0;letter-spacing:.5px}
.mut{color:var(--muted)}
.sm{font-size:17px}
.note{font-size:18px;color:var(--muted);line-height:1.15;margin:0}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-disp);font-size:8px;padding:7px 8px;background:var(--panel2);border:3px solid var(--line);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);display:flex;align-items:center;gap:4px}
.chip.on{background:var(--gold);color:var(--ink)}
.chip.lock{opacity:.55}

.btn{font-family:var(--f-disp);font-size:9px;padding:10px;background:var(--blue);border:3px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.22),0 3px 0 var(--line);text-transform:uppercase;line-height:1.35;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(.off){transform:translateY(3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.22)}
.btn.g{background:var(--green)} .btn.y{background:var(--gold);color:var(--ink)} .btn.r{background:var(--red)} .btn.d{background:var(--panel2)}
.btn.big{font-size:11px;padding:14px;width:100%}
.btn.slim{padding:8px;font-size:8px}
.btn.off{filter:grayscale(.85) brightness(.65);cursor:not-allowed}

/* match card */
.mh{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:8px}
.lgt{font-family:var(--f-disp);font-size:7px;padding:2px 4px;background:var(--lc,var(--hi));color:var(--text);border:2px solid var(--line);white-space:nowrap}
.when{margin-left:auto;color:var(--muted)}
.when.live{color:var(--orange);animation:blink 1s steps(2) infinite}
.when.ft{color:var(--lime)}
.teams{display:flex;flex-direction:column;gap:3px}
.tm{display:flex;align-items:center;gap:6px;font-size:21px}
.tm .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .gl{font-family:var(--f-disp);font-size:12px;color:var(--gold);min-width:22px;text-align:right}
.odds{display:grid;gap:6px}
.odd{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;background:var(--panel2);border:3px solid var(--line);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.odd .ol{font-family:var(--f-disp);font-size:7px;color:var(--muted)}
.odd .ov{font-size:23px;color:var(--gold);line-height:.9}
.odd .pr{font-family:var(--f-disp);font-size:7px;color:var(--muted)}
.odd.val .pr{color:var(--lime)}
.odd.bad .pr{color:var(--orange)}
.odd.sig{border-color:var(--sky)}
.odd .sg{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--f-disp);font-size:6px;font-weight:400;background:var(--sky);color:var(--ink);padding:2px 3px;border:2px solid var(--line);white-space:nowrap}
.odd.sel{background:var(--gold)}
.odd.sel .ov,.odd.sel .ol,.odd.sel .pr{color:var(--ink)}
.odd:disabled{opacity:.45;cursor:default}
.odd.win{opacity:1;background:var(--teal)}
.odd.win .ov{color:var(--text)}
.anl{display:flex;align-items:center;gap:8px;font-size:18px;padding:6px 8px;background:var(--ink);border:2px solid var(--line)}
.anl b{font-weight:400;color:var(--sky)}
.anl .v{margin-left:auto;font-family:var(--f-disp);font-size:8px;white-space:nowrap}
.v.pos{color:var(--lime)} .v.neg{color:var(--orange)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lockrow{font-family:var(--f-disp);font-size:8px;line-height:1.6;color:var(--muted);padding:10px;text-align:center;border:3px dashed var(--panel2)}

/* coupon */
.pk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed var(--panel2)}
.pk:last-child{border-bottom:0}
.pk .t{flex:1;min-width:0}
.pk .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .o{font-size:23px;color:var(--gold)}
.x{font-family:var(--f-disp);font-size:9px;width:28px;height:28px;background:var(--red);border:3px solid var(--line);padding:0;flex:none}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:20px}
.kv b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.kv b.l{color:var(--lime)} .kv b.o{color:var(--orange)}
.stake input{width:100%;font-family:var(--f-disp);font-size:14px;color:var(--gold);background:var(--ink);border:3px solid var(--line);padding:10px;user-select:text;-webkit-user-select:text}
.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qs .btn{padding:8px 2px;font-size:8px}
.err{font-family:var(--f-disp);font-size:8px;color:var(--orange);line-height:1.5}
.err:empty{display:none}
.pill{font-family:var(--f-disp);font-size:7px;padding:3px 5px;border:2px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.w{background:var(--green)} .pill.l{background:var(--red)} .pill.o{background:var(--blue)}
.st{width:18px;text-align:center;font-family:var(--f-disp);font-size:9px;flex:none}
.st.w{color:var(--lime)} .st.l{color:var(--red)} .st.p{color:var(--muted)} .st.v{color:var(--orange);animation:blink 1s steps(2) infinite}

#slipbar{flex:none;background:var(--gold);border-top:3px solid var(--line)}
#slipbar button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:9px 0;color:var(--ink);font-family:var(--f-disp);font-size:9px;text-align:left}
#slipbar .cnt{background:var(--ink);color:var(--gold);padding:3px 5px}
#slipbar .go{margin-left:auto}

/* development */
.up{display:flex;gap:10px;align-items:center}
.up .ic{width:40px;height:40px;flex:none;background:var(--ink);border:3px solid var(--line);display:grid;place-items:center}
.up .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.up .nm{font-family:var(--f-disp);font-size:9px;line-height:1.4}
.up .nm small{color:var(--muted);font-size:7px}
.up .ds{font-size:17px;color:var(--muted);line-height:1.1}
.up .btn,.skill .btn{min-width:88px;padding:9px 6px;flex-direction:column;gap:3px}
.list{display:flex;flex-direction:column;gap:10px}
.skill{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:2px dashed var(--panel2)}
.skill:last-child{border-bottom:0;padding-bottom:0}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.pips i{height:10px;background:var(--ink);border:2px solid var(--line)}
.pips i.on{background:var(--sky)}
.cmp{font-size:18px;color:var(--muted);line-height:1.15}
.cmp b{font-weight:400;color:var(--text)}
.cmp b.l{color:var(--lime)}

.achs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach{padding:6px;background:var(--panel2);border:2px solid var(--line);opacity:.55}
.ach.ok{opacity:1;background:var(--teal)}
.ach .n{font-family:var(--f-disp);font-size:8px;line-height:1.4}
.ach .d{font-size:16px;color:var(--muted)}
.ach.ok .d{color:var(--text)}

nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--panel2);border-top:3px solid var(--line);padding-block:4px;flex:none}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 5px;background:none;border:0;font-family:var(--f-disp);font-size:7px;color:var(--muted)}
nav button.on{background:var(--ink);color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
nav .bd{position:absolute;top:0;right:12%;min-width:16px;font-size:7px;padding:2px 3px;background:var(--red);color:var(--text);border:2px solid var(--line)}

/* overlays */
#toasts{position:absolute;left:0;right:0;top:60px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50}
.toast{max-width:92%;font-family:var(--f-disp);font-size:8px;line-height:1.5;padding:7px 9px;background:var(--ink);border:3px solid var(--gold);box-shadow:0 3px 0 var(--line);animation:tin .2s steps(3)}
.toast.g{border-color:var(--lime)} .toast.r{border-color:var(--red)} .toast.b{border-color:var(--sky)}
#sheet{position:absolute;inset:0;background:rgba(11,11,20,.75);display:flex;align-items:flex-end;z-index:35}
#sheet .pane{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-top:3px solid var(--gold);box-shadow:0 -3px 0 var(--line);padding-block:12px 16px;display:flex;flex-direction:column;gap:10px;animation:up .18s steps(4)}
.shead{display:flex;align-items:center;gap:8px}
.shead .x{background:var(--panel2)}
#modal{position:absolute;inset:0;background:rgba(11,11,20,.82);display:grid;place-items:center;z-index:40;padding-block:16px}
#modal .card{width:100%;max-height:100%;overflow:auto;padding:14px;animation:tin .2s steps(3)}
.big{font-family:var(--f-disp);font-size:16px;color:var(--gold);text-align:center;line-height:1.4;text-shadow:2px 2px 0 var(--red)}
.amt{font-family:var(--f-disp);font-size:20px;color:var(--lime);text-align:center}
.rain{position:absolute;top:-20px;z-index:41;pointer-events:none;animation:fall 1.6s steps(16) forwards}
@keyframes blink{50%{opacity:.35}}
@keyframes tin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
@keyframes fall{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

/* seeded rng so the Gelişim screen's long-run figures are stable between levels */
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* typical matches of a league (same seed everywhere so figures stay stable) */
function pool(lg='tr'){
  if(!POOLS[lg]){ const r=seeded(7), gf=LGB[lg].goal; POOLS[lg]=[]; for(let i=0;i<250;i++){ const d=(r()-.5)*1.6, g=(.9+r()*.35)*gf; POOLS[lg].push(calcProbs(1.27*g*Math.exp(d*.85),1.27*g*Math.exp(-d*.85))); } }
  return POOLS[lg];
}
/* league-average chance of each outcome. Odds are random around these, so no blind rule
   (always back the draw, always ÜST in a goal-heavy league...) beats the bookmaker. */
function baseRate(k,o,lg='tr',i=0){
  const key=lg+k;
  if(!baseCache[key])
    const P=pool(lg), b=baseCache[key]={};
    if(k==='sk'){ b.D=P.reduce((a,x)=>a+x.sk.D,0)/P.length; b.r=[0,1,2,3,4,5].map(i=>P.reduce((a,x)=>a+x.sk[x.skl[i]],0)/P.length); }
    else MK[k].o.forEach(x=>b[x]=P.reduce((a,y)=>a+y[k][x],0)/P.length);
  }
  /* scores are listed most-likely first, so a score's base rate is that of its rank */
  const b=baseCache[key]; return k==='sk'?(o==='D'?b.D:b.r[i]):b[o];
}
/* the analyst's estimate: real chance seen through skill-dependent noise, then blended with base
   rates by how much the analyst can trust the read, so the shown % is roughly calibrated */
function analystEst(Pk,os,k,L,lg,r=rnd){
  const m=MK[k], t=Math.pow((clamp(L,1,10)-1)/9,1.5), w=m.w0+(m.w10-m.w0)*t, sg=sigma(k,L);
  const raw=os.map(o=>Pk[o]*Math.exp(sg*gauss(r))), z=raw.reduce((a,b)=>a+b,0);
  const bz=os.reduce((a,o,i)=>a+baseRate(k,o,lg,i),0);
  return os.map((o,i)=>w*raw[i]/z+(1-w)*baseRate(k,o,lg,i)/bz);
}
/* xm = extra bookmaker margin for many-outcome markets (correct score) */
function randOdds(os,k,lg,mar,r=rnd){
  mar+=MK[k].xm||0;
  const w=os.map((o,i)=>baseRate(k,o,lg,i)*(.7+r()*.6)), ws=w.reduce((a,b)=>a+b,0);
  return w.map(x=>mkOdds(x/ws,mar));
}
function skillEval(k,L){
  const key=k+L+'_'+S.stars; if(evalCache[key]) return evalCache[key];
  const r=seeded(31+k.charCodeAt(0)); let sum=0,n=0,tot=0;
  for(const P of pool()) for(let rep=0;rep<3;rep++){
    const os=k==='sk'?P.skl.concat('D'):MK[k].o, od=randOdds(os,k,'tr',.12,r), est=analystEst(P[k],os,k,L,'tr',r);
    let best=0,bi=-1; os.forEach((o,i)=>{const ev=est[i]*od[i]; if(ev>best){best=ev;bi=i;}});
    tot++; if(best>=1.02){ sum+=P[k][os[bi]]*od[bi]; n++; }
  }
  return evalCache[key]={ret:n?sum/n:0,freq:n/tot};
}
function skillCost(k){ const L=S.sk[k], f=MK[k].f; return {tp:Math.round(25*f*Math.pow(1.6,L)),coin:Math.round(60*f*Math.pow(2.5,L))}; }

/* ---------- match model ---------- */
function pmf(l,k){let f=1;for(let i=2;i<=k;i++)f*=i;return Math.exp(-l)*Math.pow(l,k)/f;}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rnd();}while(p>L);return k-1;}
function calcProbs(lh,la){
  const N=10, ms={'1':0,X:0,'2':0}, au={A:0,U:0}, kg={V:0,Y:0}, iy={'1':0,X:0,'2':0}, sc=[];
  let tot=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const p=pmf(lh,i)*pmf(la,j); tot+=p;
    ms[i>j?'1':i===j?'X':'2']+=p; au[i+j>2?'U':'A']+=p; kg[i>0&&j>0?'V':'Y']+=p; sc.push([i+'-'+j,p]);
    const q=pmf(lh*.45,i)*pmf(la*.45,j); iy[i>j?'1':i===j?'X':'2']+=q;
  }
  const norm=o=>{const s=Object.values(o).reduce((a,b)=>a+b,0);for(const k in o)o[k]/=s;return o;};
  sc.sort((a,b)=>b[1]-a[1]);
  const top=sc.slice(0,6), sk={}; let s=0;
  top.forEach(([k,p])=>{sk[k]=p/tot;s+=p/tot;}); sk.D=Math.max(.01,1-s);
  return {ms:norm(ms),au:norm(au),kg:norm(kg),iy:norm(iy),sk,skl:top.map(t=>t[0])};
}
function mkOdds(p,mar){let o=clamp(1/(p*(1+mar)),1.03,99);return o<10?Math.round(o*100)/100:o<100?Math.round(o*10)/10:Math.round(o);}
function makeMatch(lg,ko){
  const L=LGB[lg], busy=new Set();
  S.matches.forEach(m=>{if(m.lg===lg&&!m.done){busy.add(m.h);busy.add(m.a);}});
  let pool=L.teams.map((t,i)=>i).filter(i=>!busy.has(i)); if(pool.length<2) pool=L.teams.map((t,i)=>i);
  pool.sort(()=>rnd()-.5);
  const h=pool[0], a=pool[1], d=(L.teams[h][1]-L.teams[a][1])/20;
  const lh=1.27*L.goal*Math.exp(d*.85), la=1.27*L.goal*Math.exp(-d*.85);
  const P=calcProbs(lh,la), fh=poisson(lh), fa=poisson(la), ev=[];
  const gm=()=>rnd()<.45?1+Math.floor(rnd()*45):46+Math.floor(rnd()*45);
  for(let i=0;i<fh;i++) ev.push({m:gm(),s:0});
  for(let i=0;i<fa;i++) ev.push({m:gm(),s:1});
  ev.sort((x,y)=>x.m-y.m);
  let hh=0,ha=0; ev.forEach(e=>{if(e.m<=45){e.s?ha++:hh++;}});
  const fs=fh+'-'+fa;
  const truth={ms:fh>fa?'1':fh===fa?'X':'2',au:fh+fa>2?'U':'A',kg:fh>0&&fa>0?'V':'Y',iy:hh>ha?'1':hh===ha?'X':'2',sk:P.skl.includes(fs)?fs:'D'};
  /* odds are random and know nothing about the real chances; only the overround (mar) is fixed,
     so backing every outcome of a market always loses */
  const odds={};
  MKO.forEach(k=>{const os=k==='sk'?P.skl.concat('D'):MK[k].o, od=randOdds(os,k,lg,L.mar);
    odds[k]={}; os.forEach((o,i)=>odds[k][o]=od[i]);});
  return {id:S.nextId++,lg,h,a,ko,P,odds,truth,ev,fh,fa,hh,ha,an:{},done:false,gs:0,off:0};
}

function curScore(m){const st=status(m);if(st==='pre')return null;if(st==='ft')return[m.fh,m.fa];return scoreAt(m,minute(m));}

/* ---------- analysis ----------
   The analyst estimates every outcome's chance from the real chance plus noise (smaller with skill),
   multiplies by the offered odds and recommends the outcome with the best long-run return.
   If nothing beats the odds, there is no recommendation. */
function analyze(mid,k){
  const m=findM(mid); if(!m||status(m)!=='pre'||m.an[k]) return;
  if(S.sk[k]<1) return toast(`${MK[k].n} analizini henüz bilmiyorsun. Gelişim'den öğren.`,'r');
  if(S.en<1) return toast(`Analiz hakkın bitti. Yenisi ${Math.ceil(regen()-S.enT)} sn sonra.`,'r');
  S.en--; S.stats.an++;
  const os=opts(m,k), e=analystEst(m.P[k],os,k,S.sk[k],m.lg);
  const est={}; let rec=null, best=1.02;
  os.forEach((o,i)=>{est[o]=e[i]; const ev=est[o]*m.odds[k][o]; if(ev>best){best=ev;rec=o;}});
  m.an[k]={est,rec};
  beep(988,.05); setTimeout(()=>beep(1319,.07),70);
  checkAch(false); dirty=true;
}

function ensureFixtures(){

      const last=S.matches.filter(m=>m.lg===lg).reduce((a,m)=>Math.max(a,m.ko),-1e9);
      const ko=Math.max(S.gt+30+li*4+rnd()*12,last+18+rnd()*30);

  S.gt+=gdt;

  for(const m of S.matches){
    if(!m.done&&!quiet&&status(m)==='live'&&mine.has(m.id)){
      const [h,a]=scoreAt(m,minute(m));
      if(h+a>m.gs){ m.gs=h+a; toast(`GOL! ${tcode(m.lg,m.h)} ${h}-${a} ${tcode(m.lg,m.a)}`,'b'); beep(880,.08); setTimeout(()=>beep(1175,.12),90); }
    }
    if(!m.done&&mt(m)>=m.ko+LIVE){m.done=true;settleMatch(m,quiet);dirty=true;}
  }
  const before=S.slip.length;
  S.slip=S.slip.filter(p=>{const m=findM(p.mid);return m&&status(m)==='pre';});
  if(S.slip.length!==before){dirty=true;if(!quiet) toast('Başlayan maç kupondan çıkarıldı','r');}
  const n=S.matches.length;
  S.matches=S.matches.filter(m=>!(m.done&&mt(m)>m.ko+LIVE+15&&m.id!==scene.fid));
  if(S.matches.length!==n) dirty=true;

}

function settleMatch(m,quiet){

  const touched=new Set();
  for(const b of S.bets) for(const p of b.picks) if(p.mid===m.id&&p.res===null){
    p.res=p.o===m.truth[p.k]; p.sc=m.fh+'-'+m.fa; touched.add(b);
  }
  touched.forEach(b=>{
    if(b.picks.some(p=>p.res===false)) finishBet(b,false,quiet);
    else if(b.picks.every(p=>p.res===true)) finishBet(b,true,quiet);
  });
}
function finishBet(b,won,quiet){
  S.bets=S.bets.filter(x=>x!==b);
  b.status=won?'w':'l';
  const lgs=new Set(b.picks.map(p=>p.lg)), n=b.picks.length;
  const lgm=b.picks.reduce((a,p)=>a+LGB[p.lg].xp,0)/n;
  let xp=10*n*Math.sqrt(b.odds)*lgm*(1+.25*(lgs.size-1));
  if(won){
    earn(b.pay); S.stats.won++; S.stats.winsum+=b.pay; S.stats.streak++;
    S.stats.bestStreak=Math.max(S.stats.bestStreak,S.stats.streak); S.stats.best=Math.max(S.stats.best,b.pay);
    if(n>=3) S.flags.c3=true; if(lgs.size>=3) S.flags.l3=true; if(lgs.size>=5) S.flags.l5=true;
    if(b.odds>=10) S.flags.o10=true; if(b.odds>=100) S.flags.o100=true;
    if(b.picks.some(p=>p.k==='sk')) S.flags.sk=true;
  } else { S.stats.lost++; S.stats.streak=0; xp*=.2; }
  b.xp=gainTP(xp);
  S.hist.unshift(b); S.hist=S.hist.slice(0,25);
  if(quiet&&offline){ offline[won?'w':'l']++; if(won) offline.pay+=b.pay; }
  if(!quiet){ if(won) winModal(b); else { toast(`Kupon #${b.id} yattı. +${b.xp} tecrübe`,'r'); beep(196,.18); } }
  checkAch(quiet); dirty=true;
}

/* ---------- coupon ---------- */
function slipCalc(list){
  const odds=Math.round(list.reduce((a,p)=>a*p.odds,1)*100)/100, lgs=new Set(list.map(p=>p.lg));
  const div=divBonus(lgs.size);
  let chance=1, known=0;
  list.forEach(p=>{const m=findM(p.mid); const c=m&&chanceOf(m,p.k,p.o); if(c!==null&&c!==undefined){chance*=c;known++;}});
  return {odds,lgs,div,chance,known,ev:chance*odds*div*starMul(),lim:slipLimit(list)};
}
function addPick(mid,k,o){
  const m=findM(mid); if(!m||status(m)!=='pre') return;
  const i=S.slip.findIndex(p=>p.mid===mid);
  if(i>=0){
    if(S.slip[i].k===k&&S.slip[i].o===o){S.slip.splice(i,1);beep(330,.05);dirty=true;return;}
    S.slip[i]={mid,k,o,odds:m.odds[k][o],lg:m.lg}; beep(523,.05); dirty=true; return;
  }
  if(S.slip.length>=capacity()) return toast(`Kupon dolu (${capacity()} maç). Kapasiteyi Gelişim'den artır.`,'r');
  if(S.slip.filter(p=>p.lg===m.lg).length>=MAXPL) return toast(`Aynı ligden en fazla ${MAXPL} maç. Başka ligden seç!`,'r');
  S.slip.push({mid,k,o,odds:m.odds[k][o],lg:m.lg}); beep(523,.05); dirty=true;
}
function stakeVal(){const v=parseFloat(String(S.stake).replace(',','.'));return isFinite(v)?Math.floor(v):0;}
function stakeErr(st){
  if(!S.slip.length) return 'Kupon boş.';
  if(st<1) return 'Bahis en az 1 olmalı.';
  if(st>S.coins) return 'Kasada bu kadar para yok.';
  if(st>maxStake()){ const l=slipLimit(S.slip); return `${l.name} kuponu en fazla ${fmt(l.cap)} alır. Daha yüksek bahis için kupona üst ligden maç ekle.`; }
  return '';
}
function placeBet(){
  const st=stakeVal(); if(!S.slip.length||stakeErr(st)) return;
  const c=slipCalc(S.slip);
  S.coins-=st;
  const b={id:S.stats.placed+1,stake:st,odds:c.odds,div:c.div,pay:st*c.odds*c.div*starMul(),
    picks:S.slip.map(p=>{const m=findM(p.mid);return {mid:p.mid,k:p.k,o:p.o,odds:p.odds,lg:p.lg,h:m.h,a:m.a,an:!!m.an[p.k],res:null,sc:null};})};
  S.bets.push(b); S.stats.placed++; S.stats.wager+=st; S.slip=[];
  toast(`Kupon #${b.id} oynandı. Olası kazanç ${fmt(b.pay)}`,'g'); jingle([392,523]);
  closeSheet(); view.tab='bah'; checkAch(false); dirty=true;
}
const broke=()=>S.coins<10&&!S.bets.length;

let AC=null;
function beep(f=440,d=.08,v=.04){
  if(!S||!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}

/* ---------- actions ---------- */
function act(a){
  const [c,x,y,z]=a.split(':');
  if(c!=='prestige'&&c!=='reset'&&view.confirm){view.confirm=null;dirty=true;}
  switch(c){
    case 'tab': view.tab=x; closeSheet(); $('#view').scrollTop=0; beep(440,.03); dirty=true; break;
    case 'flt': view.flt=x; dirty=true; break;
    case 'lg': view.tab='gel'; dirty=true; toast(`${LGB[x].name}: kariyer ${LGB[x].kar} ve ${fmt(LGB[x].cost)} gerek`,'b'); break;
    case 'pick': addPick(+x,y,z); break;
    case 'an': analyze(+x,y); break;
    case 'm': { const m=findM(+x); if(m) openSheet({mid:m.id,st:status(m)}); break; }
    case 'slip': openSheet({slip:true}); break;
    case 'shut': closeSheet(); break;
    case 'rm': S.slip.splice(+x,1); dirty=true; if(!S.slip.length) closeSheet(); break;
    case 'clear': S.slip=[]; closeSheet(); dirty=true; break;
    case 'q': {
      const mx=Math.min(maxStake(),Math.floor(S.coins));
      S.stake=String(x==='min'?1:x==='max'?mx:Math.max(1,Math.min(mx,Math.floor(S.coins*parseFloat(x)))));
      const i=$('#stake'); if(i) i.value=S.stake; updSlip(); break;
    }
    case 'place': { const e=stakeErr(stakeVal()); if(e){updSlip();beep(150,.12);return;} placeBet(); break; }
    case 'sk': {
      if(S.sk[x]>=SKMAX||!reqMet(x)) return;
      const c=skillCost(x);
      if(S.tp<c.tp) return toast(`${fmt(c.tp-S.tp)} tecrübe daha lazım. Kupon oyna, doğru analiz yap.`,'r');
      if(S.coins<c.coin) return toast('Yeterli paran yok.','r');
      S.tp-=c.tp; S.coins-=c.coin; S.sk[x]++;
      toast(S.sk[x]===1?`YENİ: ${MK[x].n} analizi açıldı!`:`${MK[x].n} SV ${S.sk[x]} · getiri ×${skillEval(x,S.sk[x]).ret.toFixed(2)}`,'g');
      jingle([523,659,784,1047]); checkAch(false); dirty=true; break;
    }
    case 'tool': {
      const t=TB[x], c=toolCost(t); if(T(x)>=t.max) return;
      if(S.coins<c) return toast('Yeterli paran yok.','r');
      S.coins-=c; S.tools[x]=T(x)+1; if(x==='defter') S.en++; beep(784,.06); dirty=true; break;
    }
    case 'unlock': {
      const l=LGB[x]; if(S.leagues.includes(x)) return;
      if(kariyer()<l.kar) return toast(`${l.name} için kariyer ${l.kar} gerek.`,'r');
      if(S.coins<l.cost) return toast('Yeterli paran yok.','r');
      S.coins-=l.cost; S.leagues.push(x); ensureFixtures(); jingle([523,784,1047]); toast(`${l.name} açıldı!`,'g'); checkAch(false); dirty=true; break;
    }
    case 'allow': {
      if(!broke()||Date.now()<S.allowAt) return;
      earn(100); S.allowAt=Date.now()+120000; toast('Babandan 100 harçlık geldi.','g'); beep(660,.08); dirty=true; break;
    }
    case 'sound': S.sound=!S.sound; dirty=true; beep(660,.05); break;
    case 'help': intro(); break;
    case 'close': closeModal(); break;
    case 'prestige': {
      const g=starGain(); if(!g) return toast('Efsane olmak için kariyer 30 gerek.','r');
      if(view.confirm!=='prestige'){view.confirm='prestige';dirty=true;break;}
      const keep={stars:S.stars+g,ach:S.ach,flags:S.flags,stats:S.stats,sound:S.sound,intro:true};
      S=Object.assign(newState(),keep); S.en=maxEn(); view.confirm=null; closeSheet(); ensureFixtures(); dirty=true;
      modal(`<div class="big">EFSANE OLDUN!</div><div class="amt">★ ${S.stars}</div><p class="note">Kazançların artık ×${starMul().toFixed(1)}, ${S.stars} fazladan analiz hakkın var.</p><button class="btn y big" data-act="close">YENİ SEZON</button>`);
      break;
    }
    case 'reset': {
      if(view.confirm!=='reset'){view.confirm='reset';dirty=true;break;}
      S=newState(); S.intro=true; view={tab:'mac',flt:'all',confirm:null}; closeSheet(); ensureFixtures(); dirty=true; toast('Yeni oyun başladı.','b'); break;
    }
    case 'scene': cycleFeatured(); break;
    case 'ff': S.ff=!S.ff; beep(S.ff?880:440,.05); renderFF(); break;
    case 'watch': { const m=findM(+x); if(m){ S.watch=m.id; setFeatured(m); renderSB(); beep(600,.03); dirty=true; } break; }
  }
}

/* ---------- stadium scene ---------- */
const cv=$('#pitch'), cx=cv.getContext('2d');
const CROWD=['#5d275d','#b13e53','#ef7d57','#ffcd75','#41a6f6','#3b5dc9','#94b0c2','#f4f4f4','#257179'];
const crowd=[]; for(let y=0;y<7;y++){crowd[y]=[];for(let x=0;x<80;x++) crowd[y][x]=CROWD[Math.floor(rnd()*CROWD.length)];}
const FORM=[[10,40],[34,30],[34,50],[58,34],[58,46]];
const scene={fid:null,ball:{x:80,y:40,tx:80,ty:40},pl:[],goalT:0,lastG:0,frame:0};
FORM.forEach(([x,y])=>scene.pl.push({t:0,x,y,fx:x,fy:y}));
FORM.forEach(([x,y])=>scene.pl.push({t:1,x:160-x,y,fx:160-x,fy:y}));
const featured=()=>findM(scene.fid);
function setFeatured(m){ if((m?m.id:null)!==scene.fid) dirty=true; scene.fid=m?m.id:null; if(m){const s=curScore(m);scene.lastG=s?s[0]+s[1]:0;} scene.goalT=0; $('#goal').hidden=true; }
function pickFeatured(){
  const cur=featured();
  if(cur&&status(cur)==='live') return;
  if(cur&&status(cur)==='pre'&&cur.id===S.watch) return;
  if(cur&&status(cur)==='ft'&&mt(cur)-(cur.ko+LIVE)<5) return;
  S.watch=null;
  const live=S.matches.filter(m=>status(m)==='live'&&S.leagues.includes(m.lg));
  const mine=new Set(); S.bets.forEach(b=>b.picks.forEach(p=>mine.add(p.mid)));
  const f=live.find(m=>mine.has(m.id))||live[0]||S.matches.filter(m=>status(m)==='pre').sort((a,b)=>a.ko-b.ko)[0];
  if(!cur||!f||f.id!==cur.id) setFeatured(f);
}
function cycleFeatured(){
  const live=S.matches.filter(m=>status(m)==='live');
  if(live.length<2) return;
  const i=live.findIndex(m=>m.id===scene.fid);
  setFeatured(live[(i+1)%live.length]); beep(600,.03); renderSB();
}
function renderSB(){
  const m=featured(), sb=$('#sb');
  if(!m){sb.innerHTML='<span>FİKSTÜR HAZIRLANIYOR</span>';return;}
  const st=status(m), s=curScore(m);
  const mid=st==='pre'?`<span class="min">${mmss((m.ko-S.gt)/speed())}</span>`:`<span class="scr">${s[0]}-${s[1]}</span>`;
  const tail=st==='live'?`<span class="min">${minute(m)}'</span>`:st==='ft'?'<span class="min">MS</span>':'';
  sb.innerHTML=`<span class="lgc">${LGB[m.lg].cc}</span>${bimg(m.lg,m.h,14)}<span>${tcode(m.lg,m.h)}</span>${mid}<span>${tcode(m.lg,m.a)}</span>${bimg(m.lg,m.a,14)}${tail}`;
  if(st==='live'){
    const g=s[0]+s[1];
    if(g>scene.lastG){
      const ev=m.ev.filter(e=>e.m<=minute(m)), side=ev[ev.length-1].s;
      scene.lastG=g; scene.goalT=16; scene.ball.tx=side===0?158:1; scene.ball.ty=40;
      $('#goal').hidden=false; $('#goal').textContent='GOL! '+tcode(m.lg,side?m.a:m.h);
    }
  }
}
function renderFF(){ const b=$('#ffb'); b.textContent=S.ff?'HIZ x'+FF:'HIZ x1'; b.classList.toggle('on',!!S.ff); }
function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x|0,y|0,w,h);}
function drawScene(){
  const f=++scene.frame, m=featured(), live=m&&status(m)==='live', cheer=scene.goalT>0;
  px(0,0,160,17,'#1a1c2c');
  for(let y=0;y<7;y++) for(let x=0;x<80;x++){
    if(rnd()<(cheer?.3:.02)) crowd[y][x]=CROWD[Math.floor(rnd()*CROWD.length)];
    const bob=cheer&&((x+f)%3===0)?-1:0;
    px(x*2,1+y*2+bob,2,1,crowd[y][x]); px(x*2,2+y*2+bob,2,1,'#262b44');
  }
  for(let x=0;x<160;x+=20) px(x,15,20,2,(x/20+(f>>3))%2?'#ffcd75':'#3b5dc9');
  for(let x=0;x<160;x+=16) px(x,17,16,47,(x/16)%2?'#38b764':'#2f9e57');
  const L='rgba(244,244,244,.8)';
  px(2,19,156,1,L);px(2,61,156,1,L);px(2,19,1,43,L);px(157,19,1,43,L);px(80,19,1,43,L);
  for(let a=0;a<32;a++){const t=a/32*Math.PI*2;px(80+Math.round(Math.cos(t)*8),40+Math.round(Math.sin(t)*7),1,1,L);}
  px(2,30,14,1,L);px(2,50,14,1,L);px(16,30,1,21,L);
  px(144,30,14,1,L);px(144,50,14,1,L);px(143,30,1,21,L);
  for(const gx of [0,157]){px(gx,35,3,1,'#f4f4f4');px(gx,45,3,1,'#f4f4f4');for(let y=36;y<45;y+=2)px(gx+(gx?1:0),y,2,1,'rgba(244,244,244,.4)');}
  const b=scene.ball, dt=.1;
  const tm=m?[LGB[m.lg].teams[m.h],LGB[m.lg].teams[m.a]]:[['',0,'#b13e53','#f4f4f4'],['',0,'#3b5dc9','#f4f4f4']];
  if(scene.goalT>0){
    scene.goalT--; b.x+=(b.tx-b.x)*.35; b.y+=(b.ty-b.y)*.35;
    if(scene.goalT===0){b.x=80;b.y=40;b.tx=80;b.ty=40;$('#goal').hidden=true;}
  } else if(live){
    const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy);
    if(d<2){ b.tx=14+rnd()*132; b.ty=23+rnd()*35; }
    else { const s=Math.min(d,40*dt); b.x+=dx/d*s; b.y+=dy/d*s; }
  } else { b.x+=(80-b.x)*.2; b.y+=(40-b.y)*.2; }
  for(const team of [0,1]){
    const ps=scene.pl.filter(p=>p.t===team);
    let near=null,nd=1e9; ps.forEach((p,i)=>{if(i===0)return;const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<nd){nd=d;near=p;}});
    ps.forEach((p,i)=>{
      let tx,ty;
      if(live&&p===near){tx=b.x;ty=b.y;}
      else if(i===0){tx=p.fx;ty=clamp(40+(b.y-40)*.5,34,46);}
      else {tx=p.fx+(b.x-80)*.45;ty=p.fy+(b.y-40)*.3;}
      if(!live&&!cheer){tx=p.fx;ty=p.fy;}
      const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy), s=Math.min(d,(live?22:10)*dt);
      if(d>.5){p.x+=dx/d*s;p.y+=dy/d*s;}
    });
  }
  scene.pl.slice().sort((a,b)=>a.y-b.y).forEach((p,i)=>{
    const x=Math.round(p.x)-1, y=Math.round(p.y), c=tm[p.t], gk=scene.pl.indexOf(p)%5===0;
    px(x,y-5,2,1,'#3b2b20'); px(x,y-4,2,1,'#f2c7a5');
    px(x,y-3,2,2,gk?'#a7f070':c[2]); px(x+(p.t?0:1),y-3,1,1,gk?'#257179':c[3]);
    const step=live&&((f+i)>>1)%2;
    px(x+(step?0:1),y-1,1,1,'#1a1c2c'); px(x+(step?1:0),y-1,1,1,'#f4f4f4');
  });
  px(Math.round(b.x),Math.round(b.y)+1,2,1,'rgba(0,0,0,.35)');
  px(Math.round(b.x),Math.round(b.y)-1,2,2,'#f4f4f4');
}

/* ---------- save / boot ---------- */
function save(){S.lastSave=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function loadSaved(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function hydrate(o){
  const d=newState();
  if(!o||typeof o!=='object'||o.v!==3) return d;
  const s=Object.assign(d,o);
  s.sk=Object.assign(newState().sk,o.sk||{});
  s.stats=Object.assign(newState().stats,o.stats||{});
  s.flags=o.flags||{}; s.ach=o.ach||{}; s.tools=o.tools||{};
  return s;
}
let lastT=0, halfT=0, saveT=0, achT=0, frameAcc=0;
function loop(now){
  const dt=Math.min(1,(now-lastT)/1000); lastT=now;
  const fm=featured(); if(S.ff&&fm&&!fm.done) fm.off=(fm.off||0)+dt*(FF-1);
  advance(dt*speed(),false); regenTick(dt);
  halfT+=dt; frameAcc+=dt; saveT+=dt; achT+=dt;
  if(frameAcc>=.09){frameAcc=0;drawScene();}
  if(halfT>=.5){ halfT=0; pickFeatured(); renderSB(); if(dirty) renderAll(); else tick(); }
  if(achT>=2){achT=0;checkAch(false);}
  if(saveT>=5){saveT=0;save();}
  requestAnimationFrame(loop);
}
function start(data){
  const fromHot=data&&data.state&&data.state.v===3;
  S=hydrate(fromHot?data.state:loadSaved());
  if(!fromHot){
    const el=(Date.now()-(S.lastSave||Date.now()))/1000;
    if(el>30&&S.stats.placed>0){
      regenTick(Math.min(el,24*3600));
      offline={w:0,l:0,pay:0};
      const pend=S.bets.length;
      advance(Math.min(el,3*3600)*speed(),true);
      if(pend) modal(`<div class="big">TEKRAR HOŞ GELDİN</div><p class="note">Sen yokken ${Math.floor(el/60)} dakika geçti, maçlar oynandı.</p>
        <div class="kv"><span>Kazanan kupon</span><b class="l">${offline.w}</b></div><div class="kv"><span>Kaybeden kupon</span><b class="o">${offline.l}</b></div>
        ${offline.pay?`<div class="amt">+${fmt(offline.pay)}</div>`:''}<button class="btn g big" data-act="close">TAMAM</button>`);
      offline=null;
    }
  }
  ensureFixtures();
  $('#icoin').src=icon('coin'); $('#itp').src=icon('xp'); $('#ien').src=icon('eye');
  renderAll(); pickFeatured(); renderSB(); renderFF(); drawScene();
  if(!S.intro){S.intro=true;intro();}
  window.claude?.hot?.snapshot?.(()=>({state:S}));
  requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{}); }catch(e){}
window.addEventListener('pagehide',save);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
